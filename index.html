    <script>
      (function () {
        try {
          var t = localStorage.getItem('mycar_theme');
          var resolved = 'light';
          if (t === 'dark' || t === 'light') {
            resolved = t;
          } else if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            resolved = 'dark';
          }
          document.documentElement.dataset.theme = resolved;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', resolved === 'light' ? '#F3F7FC' : '#141D2B');
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
