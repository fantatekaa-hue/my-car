name: Build MyCar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect Android project directory
        id: detect
        run: |
          if [ -f "build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android-app/build.gradle.kts" ]; then
            echo "dir=android-app" >> "$GITHUB_OUTPUT"
          else
            echo "Error: build.gradle.kts not found at repo root or android-app/."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create CI release signing keystore if missing
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v \
              -keystore mycar-ci-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias mycar_key \
              -storepass mycar2026 \
              -keypass mycar2026 \
              -dname "CN=MY CAR, OU=Mobile, O=AhmedAli, L=Cairo, S=Cairo, C=EG"
            cat << 'EOF' > keystore.properties
          storeFile=mycar-ci-release.jks
          storePassword=mycar2026
          keyAlias=mycar_key
          keyPassword=mycar2026
          EOF
          fi

      - name: Run Unit Tests
        working-directory: ${{ steps.detect.outputs.dir }}
        run: gradle testReleaseUnitTest

      - name: Build Signed Release APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MyCar-Release.apk

      - name: Upload MyCar-Release.apk
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-Release-APK
          path: ${{ steps.detect.outputs.dir }}/MyCar-Release.apk
