name: Build MyCar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK and ensure SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM=$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            (yes || true) | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi

      - name: Detect Android project directory
        id: detect
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android-app/settings.gradle.kts" ]; then
            echo "dir=android-app" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
            else
              echo "Error: settings.gradle.kts not found in repository."
              ls -la
              exit 1
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create CI release signing keystore if missing
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v \
              -keystore mycar-ci-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias mycar_key \
              -storepass mycar2026 \
              -keypass mycar2026 \
              -dname "CN=MY CAR, OU=Mobile, O=AhmedAli, L=Cairo, S=Cairo, C=EG"
            printf "storeFile=mycar-ci-release.jks\nstorePassword=mycar2026\nkeyAlias=mycar_key\nkeyPassword=mycar2026\n" > keystore.properties
          fi

      - name: Run Unit Tests
        working-directory: ${{ steps.detect.outputs.dir }}
        run: gradle testReleaseUnitTest --no-daemon

      - name: Build Signed Release APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MyCar-Release.apk

      - name: Upload MyCar-Release.apk
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-Release-APK
          path: ${{ steps.detect.outputs.dir }}/MyCar-Release.apk
